<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="app">
        <header class="header">
            <div>
                <p class="subtitle">SAGAR SMART CALCULATOR</p>
                <h1>Calculator</h1>
            </div>
            <div class="logo">✦</div>
        </header>

        <section class="calculator">

            <div class="display">
                <div id="history" class="history"></div>
                <input
                    type="text"
                    id="display"
                    value="0"
                    readonly
                    aria-label="Calculator display"
                >
            </div>

            <div class="buttons">
                <button class="utility" data-action="clear">AC</button>
                <button class="utility" data-action="delete">DEL</button>
                <button class="utility" data-value="%">%</button>
                <button class="operator" data-value="/">÷</button>

                <button data-value="7">7</button>
                <button data-value="8">8</button>
                <button data-value="9">9</button>
                <button class="operator" data-value="*">×</button>

                <button data-value="4">4</button>
                <button data-value="5">5</button>
                <button data-value="6">6</button>
                <button class="operator" data-value="-">−</button>

                <button data-value="1">1</button>
                <button data-value="2">2</button>
                <button data-value="3">3</button>
                <button class="operator" data-value="+">+</button>

                <button class="utility" data-action="history">HIS</button>
                <button data-value="0">0</button>
                <button data-value=".">.</button>
                <button class="equal" data-action="calculate">=</button>
            </div>

            <footer>
                <span>Designed with ♥</span>
                <span>Smart Calculator v1.0</span>
            </footer>

        </section>
    </main>

    <div id="historyPanel" class="history-panel hidden">
        <div class="history-heading">
            <h2>Calculation History</h2>
            <button id="closeHistory" class="close-btn">✕</button>
        </div>
        <div id="historyList"></div>
        <button id="clearHistory" class="clear-history">Clear History</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
